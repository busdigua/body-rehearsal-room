<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">身体排练室</title>
  <desc id="desc">把训练，排成一场好戏。用动作演示、节奏计时与实时姿态提示，完成属于自己的训练演出。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101310"/>
      <stop offset=".56" stop-color="#1b201d"/>
      <stop offset="1" stop-color="#111412"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="37%" r="65%">
      <stop offset="0" stop-color="#e77e5c" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#bc644b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#111412" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5d79f"/>
      <stop offset="1" stop-color="#eebd70"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8dca7"/>
      <stop offset="1" stop-color="#ed805f"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="18" r="1" fill="#fff" opacity=".10"/>
      <circle cx="62" cy="74" r="1" fill="#fff" opacity=".07"/>
      <circle cx="104" cy="33" r=".8" fill="#fff" opacity=".08"/>
      <circle cx="35" cy="108" r=".8" fill="#fff" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <rect width="1600" height="900" fill="url(#grain)" opacity=".42"/>
  <path d="M0 690H1600" stroke="#ead8b8" stroke-opacity=".08"/>
  <path d="M190 690H1410" stroke="#eebd70" stroke-opacity=".30"/>
  <ellipse cx="1050" cy="686" rx="285" ry="36" fill="#e77e5c" opacity=".12" filter="url(#glow)"/>

  <!-- stage frame -->
  <path d="M128 90V810M1472 90V810" stroke="#fff" stroke-opacity=".08"/>
  <path d="M128 90H352M1248 90H1472M128 810H370M1230 810H1472" stroke="#f0bd70" stroke-opacity=".46" stroke-width="2"/>
  <circle cx="128" cy="90" r="4" fill="#f0bd70"/>
  <circle cx="1472" cy="90" r="4" fill="#f0bd70"/>
  <circle cx="128" cy="810" r="4" fill="#f0bd70"/>
  <circle cx="1472" cy="810" r="4" fill="#f0bd70"/>

  <!-- title block -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="190" y="191" fill="#f0bd70" font-size="18" font-weight="700" letter-spacing="6">MOVE · BREATHE · REPEAT</text>
    <text x="184" y="347" fill="#f5f0e6" font-size="108" font-weight="800" letter-spacing="-5">身体排练室</text>
    <path d="M193 389H286" stroke="#ed805f" stroke-width="5"/>
    <text x="190" y="448" fill="#e7dfd0" font-size="35" font-weight="500">把训练，排成一场好戏</text>
    <text x="192" y="502" fill="#aaa99f" font-size="20" letter-spacing="1">动作示范 · 节奏计时 · 姿态提示</text>
    <text x="192" y="746" fill="#777970" font-size="15" letter-spacing="4">YOUR BODY. YOUR PACE. YOUR STAGE.</text>
  </g>

  <!-- illuminated motion figure -->
  <g transform="translate(1010 142)" fill="none" stroke="url(#figure)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="144" cy="96" r="28" fill="#f2c887" stroke="none"/>
    <circle cx="144" cy="96" r="54" stroke="#f4c781" stroke-opacity=".15" stroke-width="1.5"/>
    <path d="M144 139L134 303" stroke-width="27"/>
    <path d="M137 179L67 231L23 313" stroke-width="20"/>
    <path d="M139 181L220 211L275 274" stroke-width="20"/>
    <path d="M134 299L81 408L50 550L119 552" stroke-width="23"/>
    <path d="M134 299L209 385L248 513L310 520" stroke-width="23"/>
    <path d="M23 313L8 326M275 274L292 286M50 550L20 551M310 520L335 521" stroke-width="12"/>
  </g>
  <circle cx="1154" cy="238" r="224" fill="none" stroke="#ed805f" stroke-opacity=".09" stroke-width="1"/>
  <circle cx="1154" cy="238" r="276" fill="none" stroke="#ed805f" stroke-opacity=".045" stroke-width="1"/>
  <path d="M846 657C965 624 1105 616 1280 631" fill="none" stroke="#f0bd70" stroke-opacity=".12" stroke-width="1"/>
  <path d="M902 686C1020 660 1134 659 1268 672" fill="none" stroke="#f0bd70" stroke-opacity=".09" stroke-width="1"/>

  <!-- small cue card -->
  <g transform="translate(1311 580)">
    <rect width="120" height="118" rx="3" fill="#1c211e" stroke="#f0bd70" stroke-opacity=".38"/>
    <text x="17" y="28" fill="#a8a89d" font-family="monospace" font-size="10" letter-spacing="2">TONIGHT</text>
    <text x="15" y="75" fill="url(#gold)" font-family="monospace" font-size="36" font-weight="500">12:24</text>
    <path d="M17 94H102" stroke="#fff" stroke-opacity=".14"/>
    <path d="M17 94H67" stroke="#ed805f" stroke-width="2"/>
    <text x="17" y="110" fill="#777970" font-family="monospace" font-size="8" letter-spacing="1">TAKE 04 / 08</text>
  </g>
</svg>

